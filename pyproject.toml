[project]
name = "call-me-maybe"
version = "1.0.0"
readme = "README.md"
description = "Call me maybe - Function Calling with constrained decoding and state machine"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "numpy>=2.0.0",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=1.19.1",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }